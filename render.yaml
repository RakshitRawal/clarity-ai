# Render Deployment Blueprint for ClarityAI Full-Stack Platform
services:
  # Unified Web Service (Serves both the React Frontend & Python NLP Engine)
  - type: web
    name: clarity-ai
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true
